<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>🎙️ Ghi Âm Cuộc Họp - Voice to Docs</title>
  <style>
    /* CSS giữ nguyên như của bạn */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #0a1929 0%, #0d2137 25%, #0f2b45 50%, #0c334e 75%, #0a3a5c 100%);
      background-size: 400% 400%;
      animation: gradientBG 20s ease infinite;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      25% { background-position: 100% 0%; }
      50% { background-position: 100% 100%; }
      75% { background-position: 0% 100%; }
      100% { background-position: 0% 50%; }
    }

    .container {
      width: 100%;
      max-width: 480px;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      border-radius: 40px;
      padding: 35px 25px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5), 
                  0 0 0 1px rgba(255, 255, 255, 0.1),
                  inset 0 0 40px rgba(0, 255, 200, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    /* Tất cả tiêu đề và nút canh giữa */
    .header {
      text-align: center;
      margin-bottom: 30px;
    }

    .logo {
      font-size: 60px;
      margin-bottom: 15px;
      filter: drop-shadow(0 0 20px rgba(0, 200, 255, 0.6));
      animation: float 3s ease-in-out infinite;
      display: block;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-12px); }
    }

    h1 {
      color: #ffffff;
      font-size: 28px;
      font-weight: 800;
      text-shadow: 0 0 25px rgba(0, 180, 255, 0.7);
      margin-bottom: 8px;
      text-align: center;
      letter-spacing: 0.5px;
    }

    .subtitle {
      color: rgba(255, 255, 255, 0.65);
      font-size: 14px;
      letter-spacing: 2px;
      text-align: center;
      text-transform: uppercase;
      font-weight: 500;
    }

    .timer-card {
      background: rgba(0, 0, 0, 0.3);
      border-radius: 25px;
      padding: 25px;
      margin-bottom: 25px;
      border: 2px solid rgba(0, 200, 255, 0.2);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3),
                  inset 0 0 30px rgba(0, 150, 255, 0.05);
      text-align: center;
    }

    .timer-display {
      font-size: 64px;
      font-weight: 800;
      font-family: 'Courier New', monospace;
      color: #00e5ff;
      text-shadow: 0 0 30px rgba(0, 229, 255, 0.8),
                   0 0 60px rgba(0, 180, 255, 0.4);
      letter-spacing: 4px;
      margin-bottom: 10px;
      text-align: center;
      transition: all 0.3s ease;
    }

    .timer-display.warning {
      color: #ff9100;
      text-shadow: 0 0 30px rgba(255, 145, 0, 0.8),
                   0 0 60px rgba(255, 100, 0, 0.4);
      animation: pulse-warning 1s infinite;
    }

    .timer-display.danger {
      color: #ff1744;
      text-shadow: 0 0 30px rgba(255, 23, 68, 0.8),
                   0 0 60px rgba(255, 0, 50, 0.4);
      animation: pulse-danger 0.5s infinite;
    }

    @keyframes pulse-warning {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }

    @keyframes pulse-danger {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(1.05); }
    }

    .timer-status {
      color: rgba(255, 255, 255, 0.8);
      font-size: 15px;
      font-weight: 600;
      text-align: center;
      letter-spacing: 1px;
    }

    .max-time-info {
      color: rgba(255, 255, 255, 0.5);
      font-size: 12px;
      margin-top: 5px;
      text-align: center;
    }

    .card {
      background: rgba(255, 255, 255, 0.06);
      border-radius: 22px;
      padding: 20px;
      margin-bottom: 20px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
    }

    label {
      display: block;
      color: #b3e5fc;
      font-weight: 600;
      margin-bottom: 10px;
      font-size: 14px;
      letter-spacing: 0.8px;
      text-align: center;
      text-transform: uppercase;
    }

    input {
      width: 100%;
      padding: 14px 18px;
      border-radius: 15px;
      border: 2px solid rgba(255, 255, 255, 0.2);
      background: rgba(0, 0, 0, 0.25);
      color: #fff;
      font-size: 16px;
      outline: none;
      transition: all 0.3s ease;
      text-align: center;
      font-weight: 500;
    }

    input:focus {
      border-color: #00b4db;
      box-shadow: 0 0 20px rgba(0, 180, 219, 0.4);
      background: rgba(0, 0, 0, 0.35);
    }

    input::placeholder {
      color: rgba(255, 255, 255, 0.4);
    }

    textarea {
      width: 100%;
      height: 180px;
      padding: 15px;
      border-radius: 18px;
      border: 2px solid rgba(255, 255, 255, 0.2);
      background: rgba(0, 0, 0, 0.25);
      color: #fff;
      font-size: 15px;
      line-height: 1.6;
      resize: none;
      outline: none;
      font-family: 'Times New Roman', serif;
      transition: all 0.3s ease;
    }

    textarea:focus {
      border-color: #00b4db;
      box-shadow: 0 0 20px rgba(0, 180, 219, 0.4);
      background: rgba(0, 0, 0, 0.35);
    }

    textarea::placeholder {
      color: rgba(255, 255, 255, 0.4);
      font-family: 'Segoe UI', sans-serif;
      text-align: center;
      padding-top: 60px;
    }

    /* Canh giữa tất cả các nút */
    .button-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 20px;
    }

    .button-row {
      display: flex;
      gap: 12px;
      justify-content: center;
    }

    button {
      padding: 15px 25px;
      border-radius: 50px;
      border: none;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      backdrop-filter: blur(10px);
    }

    .btn-record {
      width: 100%;
      background: linear-gradient(135deg, #00b4db, #0083b0);
      color: white;
      box-shadow: 0 8px 25px rgba(0, 180, 219, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.3);
      font-size: 17px;
      padding: 18px;
    }

    .btn-record:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 35px rgba(0, 180, 219, 0.6);
    }

    .btn-record.recording {
      background: linear-gradient(135deg, #ff1744, #d50000);
      box-shadow: 0 8px 30px rgba(255, 23, 68, 0.6);
      animation: pulse-record 1.5s infinite;
    }

    @keyframes pulse-record {
      0% { box-shadow: 0 0 0 0 rgba(255, 23, 68, 0.7); }
      70% { box-shadow: 0 0 0 25px rgba(255, 23, 68, 0); }
      100% { box-shadow: 0 0 0 0 rgba(255, 23, 68, 0); }
    }

    .btn-pause {
      flex: 1;
      background: linear-gradient(135deg, #ff9100, #ff6d00);
      color: white;
      box-shadow: 0 5px 20px rgba(255, 145, 0, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .btn-pause:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(255, 145, 0, 0.5);
    }

    .btn-pause.paused {
      background: linear-gradient(135deg, #00c853, #009624);
      box-shadow: 0 5px 20px rgba(0, 200, 83, 0.35);
    }

    .btn-create {
      width: 100%;
      background: linear-gradient(135deg, #11998e, #38ef7d);
      color: white;
      box-shadow: 0 8px 25px rgba(56, 239, 125, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.3);
      font-size: 16px;
      padding: 16px;
    }

    .btn-create:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 35px rgba(56, 239, 125, 0.55);
    }

    .btn-create:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .btn-reset {
      flex: 1;
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.2);
      font-size: 13px;
    }

    .btn-reset:hover {
      background: rgba(255, 255, 255, 0.15);
      transform: translateY(-2px);
    }

    .status {
      text-align: center;
      margin-top: 20px;
      padding: 12px;
      border-radius: 15px;
      background: rgba(0, 0, 0, 0.2);
      color: #b3e5fc;
      font-size: 14px;
      min-height: 45px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 500;
      letter-spacing: 0.5px;
      transition: all 0.3s ease;
    }

    .status.success {
      background: rgba(0, 200, 83, 0.2);
      border: 1px solid rgba(0, 200, 83, 0.3);
      color: #69f0ae;
    }

    .status.error {
      background: rgba(255, 23, 68, 0.2);
      border: 1px solid rgba(255, 23, 68, 0.3);
      color: #ff5252;
    }

    .status.warning {
      background: rgba(255, 145, 0, 0.2);
      border: 1px solid rgba(255, 145, 0, 0.3);
      color: #ffab40;
    }

    .loading-spinner {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: #00e5ff;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @media (max-width: 400px) {
      .container {
        padding: 25px 18px;
        border-radius: 30px;
      }
      h1 {
        font-size: 24px;
      }
      .timer-display {
        font-size: 50px;
      }
      button {
        font-size: 13px;
        padding: 13px 18px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Header canh giữa -->
    <div class="header">
      <span class="logo">🎙️</span>
      <h1>Ghi Âm Cuộc Họp</h1>
      <p class="subtitle">Voice to Document</p>
    </div>

    <!-- Đồng hồ đếm thời gian -->
    <div class="timer-card">
      <div class="timer-display" id="timerDisplay">00:00</div>
      <div class="timer-status" id="timerStatus">⏸️ Sẵn sàng ghi âm</div>
      <div class="max-time-info">⏱️ Tối đa: <strong>30 phút</strong> / lần</div>
    </div>

    <!-- Tên tài liệu -->
    <div class="card">
      <label>📝 Tên cuộc họp</label>
      <input type="text" id="docName" placeholder="Nhập tên cuộc họp..." value="Biên bản cuộc họp">
    </div>

    <!-- Nội dung ghi âm -->
    <div class="card">
      <label>📄 Nội dung ghi âm</label>
      <textarea id="content" placeholder="Nội dung sẽ hiển thị ở đây khi bạn ghi âm..." readonly></textarea>
    </div>

    <!-- Các nút canh giữa -->
    <div class="button-group">
      <!-- Nút ghi âm chính -->
      <button class="btn-record" id="recordBtn" onclick="toggleRecording()">
        <span id="recordIcon">🎤</span>
        <span id="recordText">BẮT ĐẦU GHI ÂM</span>
      </button>

      <!-- Nút tạm dừng và reset -->
      <div class="button-row">
        <button class="btn-pause" id="pauseBtn" onclick="togglePause()" disabled>
          <span id="pauseIcon">⏸️</span>
          <span id="pauseText">TẠM DỪNG</span>
        </button>
        <button class="btn-reset" onclick="resetRecording()">
          🔄 XÓA
        </button>
      </div>

      <!-- Nút tạo tài liệu -->
      <button class="btn-create" id="createBtn" onclick="createDocument()" disabled>
        📄✨ TẠO TÀI LIỆU DOCX
      </button>
    </div>

    <!-- Trạng thái -->
    <div class="status" id="status">👆 Nhấn "BẮT ĐẦU GHI ÂM" để bắt đầu</div>
  </div>

  <script>
    // ============ CẤU HÌNH ============
    // ⚠️ DÁN URL WEB APP APPS SCRIPT CỦA BẠN VÀO ĐÂY (kết thúc bằng /exec)
    const WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbzRq9bJE0Pw5hiyHeiLH7zAzkUkN2erGIWye0EuTR-KzCC0ZOLteAX1DPql8Wm6uJ88/exec';
    const MAX_RECORDING_TIME = 30 * 60; // 30 phút (tính bằng giây)
    const WARNING_TIME = 25 * 60; // Cảnh báo khi còn 5 phút
    const DANGER_TIME = 28 * 60; // Cảnh báo nguy hiểm khi còn 2 phút
    
    // ============ BIẾN TOÀN CỤC ============
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition;
    let isRecording = false;
    let isPaused = false;
    let recordingTimer;
    let elapsedSeconds = 0;
    let totalPausedTime = 0;
    let pauseStartTime;
    
    // QUAN TRỌNG: Các biến quản lý nội dung để tránh lặp
    let finalText = '';           // Nội dung đã hoàn chỉnh (các từ đã được xác nhận)
    let interimText = '';         // Nội dung tạm thời (đang nhận dạng)
    let lastFinalText = '';       // Lưu lại nội dung final lần trước để so sánh
    
    // ============ KHỞI TẠO ============
    function initSpeechRecognition() {
      if (!SpeechRecognition) {
        document.getElementById('recordBtn').style.display = 'none';
        updateStatus('⚠️ Trình duyệt không hỗ trợ nhận dạng giọng nói. Vui lòng dùng Chrome hoặc Edge.', 'error');
        return false;
      }
      
      recognition = new SpeechRecognition();
      recognition.lang = 'vi-VN';
      recognition.continuous = true;
      recognition.interimResults = true;
      recognition.maxAlternatives = 1;
      
      recognition.onstart = () => {
        console.log('🎙️ Speech recognition started');
      };

      recognition.onresult = (event) => {
        if (isPaused) return;
        
        let currentFinal = '';
        let currentInterim = '';
        
        // Duyệt qua tất cả kết quả
        for (let i = 0; i < event.results.length; i++) {
          const transcript = event.results[i][0].transcript;
          if (event.results[i].isFinal) {
            currentFinal += transcript + ' ';
          } else {
            currentInterim += transcript;
          }
        }
        
        // Xử lý nội dung final (đã xác nhận)
        if (currentFinal.trim()) {
          // So sánh với nội dung final đã lưu trước đó để tránh lặp
          const newText = currentFinal.trim();
          const lastText = lastFinalText.trim();
          
          // Nếu nội dung mới hoàn toàn khác hoặc dài hơn đáng kể (thêm từ mới)
          if (newText !== lastText && newText.length > lastText.length) {
            // Kiểm tra xem nội dung mới có chứa nội dung cũ không (tránh trùng lặp)
            if (!lastText || !newText.includes(lastText) || newText.length - lastText.length > 20) {
              // Thêm nội dung mới vào finalText
              if (lastText && !newText.startsWith(lastText)) {
                // Nếu không bắt đầu bằng nội dung cũ, thêm vào
                finalText += currentFinal;
              } else if (lastText && newText.startsWith(lastText)) {
                // Nếu bắt đầu bằng nội dung cũ, chỉ thêm phần mới
                const additionalText = newText.substring(lastText.length).trim();
                if (additionalText) {
                  finalText += additionalText + ' ';
                }
              } else {
                // Trường hợp bình thường
                finalText += currentFinal;
              }
              
              lastFinalText = currentFinal;
            }
          }
        }
        
        // Cập nhật interim
        interimText = currentInterim;
        
        // Hiển thị nội dung: final + interim
        let displayContent = finalText;
        if (interimText.trim()) {
          displayContent += interimText;
        }
        
        document.getElementById('content').value = displayContent;
        
        // Cập nhật trạng thái
        if (interimText.trim()) {
          document.getElementById('status').innerHTML = '🔊 Đang nghe: ' + interimText;
        }
      };
      
      recognition.onerror = (event) => {
        console.error('Lỗi nhận dạng giọng nói:', event.error);
        
        if (event.error === 'no-speech') {
          updateStatus('⚠️ Không phát hiện giọng nói. Tiếp tục lắng nghe...', 'warning');
        } else if (event.error === 'audio-capture') {
          updateStatus('❌ Không tìm thấy microphone. Vui lòng kiểm tra lại.', 'error');
          stopRecording();
        } else if (event.error === 'not-allowed') {
          updateStatus('❌ Quyền truy cập microphone bị từ chối.', 'error');
          stopRecording();
        } else {
          updateStatus('❌ Lỗi: ' + event.error, 'error');
        }
      };
      
      recognition.onend = () => {
        console.log('⏹️ Speech recognition ended');
        if (isRecording && !isPaused) {
          // Tự động khởi động lại nếu đang ghi âm
          try {
            recognition.start();
            console.log('🔄 Tự động khởi động lại recognition');
          } catch (e) {
            console.error('Không thể khởi động lại:', e);
            stopRecording();
          }
        }
      };
      
      return true;
    }
    
    // ============ CẬP NHẬT GIAO DIỆN ============
    function getTotalContent() {
      return finalText + (interimText.trim() ? interimText : '');
    }
    
    function updateTimer() {
      const hours = Math.floor(elapsedSeconds / 3600);
      const minutes = Math.floor((elapsedSeconds % 3600) / 60);
      const seconds = elapsedSeconds % 60;
      
      let timeString;
      if (hours > 0) {
        timeString = `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
      } else {
        timeString = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
      }
      
      const timerDisplay = document.getElementById('timerDisplay');
      timerDisplay.textContent = timeString;
      
      // Thay đổi màu sắc dựa trên thời gian
      timerDisplay.classList.remove('warning', 'danger');
      if (elapsedSeconds >= DANGER_TIME) {
        timerDisplay.classList.add('danger');
        updateStatus('🔴 Sắp hết thời gian! Chỉ còn ' + formatTime(MAX_RECORDING_TIME - elapsedSeconds), 'error');
      } else if (elapsedSeconds >= WARNING_TIME) {
        timerDisplay.classList.add('warning');
        updateStatus('🟡 Còn ' + formatTime(MAX_RECORDING_TIME - elapsedSeconds) + ' trước khi đạt giới hạn', 'warning');
      }
    }
    
    function formatTime(seconds) {
      const min = Math.floor(seconds / 60);
      const sec = seconds % 60;
      return min + ' phút ' + sec + ' giây';
    }
    
    function updateStatus(message, type = '') {
      const statusEl = document.getElementById('status');
      statusEl.innerHTML = message;
      statusEl.className = 'status ' + type;
    }
    
    // ============ ĐIỀU KHIỂN GHI ÂM ============
    function toggleRecording() {
      if (isRecording) {
        stopRecording();
      } else {
        startRecording();
      }
    }
    
    function startRecording() {
      if (!recognition) {
        if (!initSpeechRecognition()) return;
      }
      
      // Reset nếu bắt đầu mới
      if (elapsedSeconds === 0) {
        finalText = '';
        interimText = '';
        lastFinalText = '';
        totalPausedTime = 0;
        document.getElementById('content').value = '';
      }
      
      isRecording = true;
      isPaused = false;
      
      try {
        recognition.start();
        console.log('🎙️ Bắt đầu ghi âm');
      } catch (e) {
        console.error('Lỗi khởi động recognition:', e);
        updateStatus('❌ Không thể bắt đầu ghi âm. Vui lòng thử lại.', 'error');
        return;
      }
      
      // Cập nhật UI
      const btn = document.getElementById('recordBtn');
      btn.classList.add('recording');
      document.getElementById('recordIcon').textContent = '⏺️';
      document.getElementById('recordText').textContent = 'DỪNG GHI ÂM';
      document.getElementById('pauseBtn').disabled = false;
      document.getElementById('pauseBtn').classList.remove('paused');
      document.getElementById('pauseIcon').textContent = '⏸️';
      document.getElementById('pauseText').textContent = 'TẠM DỪNG';
      document.getElementById('createBtn').disabled = true;
      document.getElementById('timerStatus').textContent = '🔴 Đang ghi âm...';
      
      updateStatus('🎙️ Đang ghi âm cuộc họp...', '');
      
      // Bắt đầu đếm thời gian
      startTimer();
    }
    
    function stopRecording() {
      if (!isRecording) return;
      
      isRecording = false;
      isPaused = false;
      
      try {
        recognition.stop();
        console.log('⏹️ Dừng ghi âm');
      } catch (e) {
        console.error('Lỗi dừng recognition:', e);
      }
      
      // Cập nhật UI
      const btn = document.getElementById('recordBtn');
      btn.classList.remove('recording');
      document.getElementById('recordIcon').textContent = '🎤';
      document.getElementById('recordText').textContent = 'BẮT ĐẦU GHI ÂM';
      document.getElementById('pauseBtn').disabled = true;
      document.getElementById('pauseBtn').classList.remove('paused');
      document.getElementById('pauseIcon').textContent = '⏸️';
      document.getElementById('pauseText').textContent = 'TẠM DỪNG';
      
      // Kích hoạt nút tạo tài liệu nếu có nội dung
      if (finalText.trim().length > 0) {
        document.getElementById('createBtn').disabled = false;
        document.getElementById('timerStatus').textContent = '✅ Hoàn thành ghi âm';
        updateStatus('✅ Đã ghi âm ' + formatTime(elapsedSeconds) + '. Có thể tạo tài liệu ngay!', 'success');
      } else {
        document.getElementById('timerStatus').textContent = '⏸️ Chưa có nội dung';
        updateStatus('⚠️ Chưa có nội dung được ghi âm.', 'warning');
      }
      
      // Dừng đếm thời gian
      stopTimer();
    }
    
    function togglePause() {
      if (!isRecording) return;
      
      if (isPaused) {
        resumeRecording();
      } else {
        pauseRecording();
      }
    }
    
    function pauseRecording() {
      if (!isRecording || isPaused) return;
      
      isPaused = true;
      pauseStartTime = Date.now();
      
      try {
        recognition.stop();
        console.log('⏸️ Tạm dừng ghi âm');
      } catch (e) {
        console.error('Lỗi tạm dừng:', e);
      }
      
      // Cập nhật UI
      document.getElementById('pauseBtn').classList.add('paused');
      document.getElementById('pauseIcon').textContent = '▶️';
      document.getElementById('pauseText').textContent = 'TIẾP TỤC';
      document.getElementById('timerStatus').textContent = '⏸️ Đang tạm dừng';
      
      // Dừng timer
      stopTimer();
      
      updateStatus('⏸️ Đã tạm dừng ghi âm. Nhấn "TIẾP TỤC" để ghi tiếp.', 'warning');
    }
    
    function resumeRecording() {
      if (!isRecording || !isPaused) return;
      
      isPaused = false;
      
      // Tính thời gian tạm dừng
      if (pauseStartTime) {
        totalPausedTime += (Date.now() - pauseStartTime) / 1000;
        pauseStartTime = null;
      }
      
      try {
        recognition.start();
        console.log('▶️ Tiếp tục ghi âm');
      } catch (e) {
        console.error('Lỗi tiếp tục:', e);
        updateStatus('❌ Không thể tiếp tục ghi âm.', 'error');
        return;
      }
      
      // Cập nhật UI
      document.getElementById('pauseBtn').classList.remove('paused');
      document.getElementById('pauseIcon').textContent = '⏸️';
      document.getElementById('pauseText').textContent = 'TẠM DỪNG';
      document.getElementById('timerStatus').textContent = '🔴 Đang ghi âm...';
      
      // Tiếp tục timer
      startTimer();
      
      updateStatus('▶️ Tiếp tục ghi âm...', '');
    }
    
    function resetRecording() {
      if (isRecording) {
        if (confirm('Bạn đang ghi âm. Bạn có chắc muốn xóa tất cả nội dung?')) {
          stopRecording();
          clearAll();
        }
      } else {
        clearAll();
      }
    }
    
    function clearAll() {
      finalText = '';
      interimText = '';
      lastFinalText = '';
      elapsedSeconds = 0;
      totalPausedTime = 0;
      document.getElementById('content').value = '';
      updateTimer();
      document.getElementById('timerDisplay').textContent = '00:00';
      document.getElementById('timerDisplay').classList.remove('warning', 'danger');
      document.getElementById('timerStatus').textContent = '⏸️ Sẵn sàng ghi âm';
      document.getElementById('createBtn').disabled = true;
      updateStatus('🔄 Đã xóa nội dung. Sẵn sàng ghi âm mới.', '');
    }
    
    // ============ QUẢN LÝ THỜI GIAN ============
    function startTimer() {
      stopTimer(); // Xóa timer cũ nếu có
      
      recordingTimer = setInterval(() => {
        elapsedSeconds++;
        updateTimer();
        
        // Tự động dừng khi đạt giới hạn
        if (elapsedSeconds >= MAX_RECORDING_TIME) {
          updateStatus('⏰ Đã đạt giới hạn 30 phút. Tự động dừng ghi âm.', 'error');
          stopRecording();
        }
      }, 1000);
    }
    
    function stopTimer() {
      if (recordingTimer) {
        clearInterval(recordingTimer);
        recordingTimer = null;
      }
    }
    
    // ============ TẠO TÀI LIỆU ============
    function createDocument() {
      const docName = document.getElementById('docName').value.trim();
      const content = finalText.trim(); // Chỉ lấy nội dung đã hoàn chỉnh (không lấy interim)
      
      if (!docName) {
        updateStatus('⚠️ Vui lòng nhập tên cuộc họp', 'error');
        return;
      }
      
      if (!content) {
        updateStatus('⚠️ Chưa có nội dung để tạo tài liệu', 'error');
        return;
      }
      
      // Thêm thông tin thời gian vào nội dung
      const now = new Date();
      const timeInfo = '=== BIÊN BẢN CUỘC HỌP ===\n' +
                      'Thời gian: ' + now.toLocaleString('vi-VN') + '\n' +
                      'Thời lượng ghi âm: ' + formatTime(elapsedSeconds) + '\n' +
                      '================================\n\n';
      
      const fullContent = timeInfo + content;
      
      updateStatus('<span class="loading-spinner"></span> Đang tạo tài liệu...', '');
      document.getElementById('createBtn').disabled = true;

      if (!WEBAPP_URL || WEBAPP_URL.indexOf('DÁN_URL') !== -1) {
        updateStatus('⚠️ Chưa cấu hình WEBAPP_URL trong file index.html. Xem hướng dẫn.', 'error');
        document.getElementById('createBtn').disabled = false;
        return;
      }

      // Dùng Content-Type: text/plain để tránh preflight CORS (Apps Script không xử lý OPTIONS)
      fetch(WEBAPP_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({
          docName: docName,
          content: fullContent,
          durationSeconds: elapsedSeconds
        })
      })
        .then((res) => res.json())
        .then((result) => {
          if (result.success) {
            updateStatus(
              '✅ Tài liệu đã được tạo thành công!<br>📄 ' + result.fileName +
              '<br>📁 Thư mục: ' + result.folder,
              'success'
            );
            document.getElementById('createBtn').disabled = false;

            // Hỏi có muốn mở tài liệu không
            setTimeout(() => {
              if (confirm('Tài liệu đã được tạo. Bạn có muốn mở ngay không?')) {
                window.open(result.url, '_blank');
              }
            }, 1000);
          } else {
            updateStatus('❌ Lỗi: ' + result.error, 'error');
            document.getElementById('createBtn').disabled = false;
          }
        })
        .catch((error) => {
          updateStatus('❌ Lỗi kết nối tới backend: ' + error.message, 'error');
          document.getElementById('createBtn').disabled = false;
          console.error(error);
        });
    }
    
    // ============ KHỞI TẠO ============
    window.onload = function() {
      initSpeechRecognition();
      updateTimer();
    };
    
    // Xử lý khi đóng trang
    window.onbeforeunload = function() {
      if (isRecording) {
        return 'Bạn đang ghi âm. Bạn có chắc muốn rời khỏi trang?';
      }
    };
  </script>
</body>
